spring:
  datasource:

    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/larimar_db}
    username: ${DATASOURCE_USER:root}
    password: ${DATASOURCE_PASSWORD:root}

    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      validationTimeout: 600000
      maximumPoolSize: 20
      connection-timeout: 60000
    tomcat:
        validation-query: SELECT 1
        test-on-borrow: true
        validation-interval: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

frontend:
  url: ${FRONTEND_URL:http://localhost:8080}
